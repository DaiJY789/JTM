<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>惊堂木</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <link rel="apple-touch-icon" href="/static/logo.png" />
    <meta name="theme-color" content="#18181b" />
    <link rel="stylesheet" href="/static/styles.css?v=20261015-unified-url-fluid" />
  </head>
  <body>
    <a class="skip-link" href="#textInput">跳转到输入区</a>
    <main class="app-shell">
      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭侧边栏" tabindex="-1" hidden></button>
      <aside class="conversation-list-panel" id="sidebarPanel" aria-label="侧边栏">
        <button class="sidebar-close" id="sidebarCloseBtn" type="button" aria-label="关闭侧边栏"><span aria-hidden="true">×</span></button>
        <div class="sidebar-brand">
          <img src="/static/logo.png" alt="" />
          <div><strong>惊堂木</strong></div>
          <p>核查信息，辅助判断。</p>
        </div>
        <button class="secondary-action" id="newConversationBtn" type="button">新对话</button>
        <section class="control-band" aria-label="参数设置">
          <div class="control-group">
            <span class="control-label">任务</span>
            <div class="segmented task-selector" data-field="task" aria-label="任务">
              <button class="segment active" type="button" data-value="multimodal_fact_checking">多模态事实核查</button>
              <button class="segment" type="button" data-value="deepfake_detection">深度伪造检测</button>
              <button class="segment" type="button" data-value="aigc_detection" disabled title="暂未开放">大模型生成检测</button>
            </div>
          </div>
        </section>
        <div class="conversation-list-header">
          <div class="conversation-list-heading"><span class="control-label" id="conversationListTitle">历史记录</span><span class="history-total" id="conversationListCount" aria-label="历史对话数量">0</span></div>
          <button class="secondary-action" id="toggleHistoryDeleteBtn" type="button" aria-pressed="false">允许删除</button>
        </div>
        <div class="conversation-list" id="conversationList">暂无历史对话</div>
        <div class="sidebar-footer">
          <button class="language-toggle" id="languageToggleBtn" type="button" aria-label="当前语言：中文，点击切换为英文" title="当前语言：中文，点击切换为英文">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M9 3v2M5 5c.7 5 3.5 8.3 7 10M13 5c-.8 4.5-4 8-9 11M13 21l4-10 4 10M14.2 18h5.6" /></svg>
            <span class="language-code" aria-hidden="true">中</span>
          </button>
        </div>
      </aside>
      <section class="workspace" data-mobile-panel="content">
        <header class="topbar">
          <div class="brand-block">
            <div class="brand-title">
              <button class="sidebar-toggle" id="sidebarToggleBtn" type="button" aria-controls="sidebarPanel" aria-expanded="true" aria-label="收起侧边栏" title="收起侧边栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16M14 9l-3 3 3 3" /></svg></button>
              <span class="workspace-eyebrow" id="workspaceTaskName">多模态事实核查</span>
            </div>
            <h1>工作台</h1>
            <p>提交待核查的文本与图片，查看结论和分析依据。</p>
          </div>
          <div class="panel result-summary" aria-label="检测结果">
            <dl class="metric-list">
              <div><dt id="labelTitle">标签</dt><dd><span class="verdict-badge is-placeholder" id="resultLabel" data-tone="neutral">-</span></dd></div>
              <div><dt id="aiTitle">伪造类型</dt><dd id="aiScore">-</dd></div>
              <div><dt id="confidenceTitle">置信度</dt><dd id="resultConfidence">-</dd></div>
            </dl>
            <div class="result-meta">
              <span>运行时间 <span class="status-pill runtime-pill" id="resultRuntime">-</span></span>
              <span>运行状态 <span class="status-pill idle" id="statusPill" role="status">等待输入</span></span>
            </div>
          </div>
        </header>
        <div class="workspace-switcher" role="group" aria-label="切换工作区">
          <button type="button" data-mobile-view="dialogue" aria-controls="dialoguePanel" aria-pressed="false">对话</button>
          <button type="button" data-mobile-view="content" aria-controls="contentPanel" aria-pressed="true">输入内容</button>
        </div>
        <div class="workbench-layout">
          <section class="panel dialogue-column conversation-history" id="dialoguePanel" aria-label="对话">
            <div class="result-header">
              <h2 id="historyTitle">对话</h2>
            </div>
            <details class="conversation-conclusion" id="conversationConclusion" hidden>
              <summary>核查结论与依据</summary>
              <pre class="summary-box" id="summaryBox" aria-live="polite">输入待核查内容后，这里将展示检测结论与分析依据。</pre>
            </details>
            <div id="conversationHistory" class="history-list">暂无历史</div>
            <div class="prompt-panel dialogue-composer">
              <div class="prompt-row">
                <input id="questionInput" type="text" aria-label="输入消息" placeholder="首次检测可留空，之后可继续追问" />
                <button class="primary-action" id="submitBtn" type="button">开始检测</button>
              </div>
            </div>
          </section>

          <aside class="content-column" id="contentPanel" aria-label="输入内容">
            <section class="panel input-panel" aria-label="输入区">
              <div class="preview-sections">
                <div class="text-preview-section">
                  <div class="field-heading">
                    <div class="panel-heading"><label class="panel-title" for="textInput">文本预览</label><span class="field-tag">文本输入</span></div>
                  </div>
                  <textarea id="textInput" rows="6" placeholder="输入新闻正文、事实陈述或配图对应的新闻文本"></textarea>
                </div>
                <div class="media-panel">
                  <div class="media-heading">
                    <div class="media-title-row">
                      <label class="panel-title">图片预览</label>
                      <div class="file-picker-field">
                        <button class="file-button" id="addImageBtn" type="button" aria-label="选择图片" title="选择图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
                        <input id="imageInput" class="file-input" type="file" accept="image/*" multiple />
                      </div>
                    </div>
                    <p class="image-selection-meta" id="imageSelectionMeta" role="status" hidden></p>
                  </div>
                  <div class="preview" id="imagePreview"></div>

                </div>
              </div>
              <div class="url-section">
                <div class="field-heading"><label class="panel-title" for="urlInput">URL</label></div>
                <div class="confirmable-url-field">
                  <input id="urlInput" type="url" placeholder="粘贴网页或图片链接" aria-describedby="urlImportStatus" />
                  <button class="url-confirm-button" id="importUrlBtn" type="button">导入</button>
                </div>
                <p class="url-import-status" id="urlImportStatus" role="status" hidden></p>
                <input id="webpageUrlInput" type="hidden" />
                <input id="imageUrlInput" type="hidden" />
              </div>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <dialog class="image-viewer" id="imageViewer" aria-label="查看图片">
      <div class="image-viewer-toolbar">
        <span id="imageViewerTitle">图片预览</span>
        <button id="imageViewerCloseBtn" type="button" aria-label="关闭图片预览">×</button>
      </div>
      <div class="image-viewer-canvas"><img id="imageViewerImage" alt="" /></div>
    </dialog>

    <script src="/static/app.js?v=20261015-unified-url-fluid"></script>
  </body>
</html>
